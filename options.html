<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Options</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f9fc;
      color: #121212;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #eef2f8 0%, #ffffff 100%);
    }

    .wrapper {
      width: 100%;
      max-width: 760px;
      padding: 28px 32px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 28px 60px rgba(17, 24, 39, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      letter-spacing: -0.03em;
    }

    .description {
      margin: 0 0 24px;
      color: #475569;
      line-height: 1.6;
      font-size: 0.98rem;
    }

    .input-grid {
      display: grid;
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      color: #0f172a;
    }

    input[type="text"], textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.98rem;
      color: #0f172a;
      background: #f8fafc;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }

    .hint {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    button {
      margin-top: 18px;
      width: 100%;
      max-width: 220px;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.16);
    }

    #status {
      min-height: 26px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .wrapper {
        padding: 22px;
        border-radius: 20px;
      }

      button {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Comfy Chrome Companion</h1>
    <div class="input-grid">
      <div class="input-group">
        <label for="clientId">Client ID</label>
        <input type="text" id="clientId" placeholder="Enter Client ID">
      </div>
      <div class="input-group">
        <label for="comfyUrl">ComfyUI URL</label>
        <input type="text" id="comfyUrl" placeholder="https://localhost:8188/prompt">
        <p class="hint">Use the full ComfyUI prompt endpoint URL.</p>
      </div>
      <div class="input-group">
        <label for="workflow">Workflow JSON</label>
        <textarea id="workflow" placeholder="Enter workflow JSON here"></textarea>
        <p class="hint">Optional JSON template; use <code>{{image_url}}</code> or <code>{{image_data}}</code> placeholders.</p>
      </div>
    </div>
    <button id="save">Save settings</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
